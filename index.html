<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>影像製作管理</title>
<style>
  html, body { margin: 0; height: 100%; background: #f5f7f2; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  p { position: fixed; left: 0; right: 0; bottom: 8px; margin: 0; text-align: center; font: 12px/1.4 sans-serif; color: #8a9382; z-index: -1; }
</style>
</head>
<body>
<p>載入中… 如果一直沒有畫面，<a id="direct" href="#">請點這裡直接開啟</a></p>
<iframe id="app" title="影像製作管理" allow="clipboard-read; clipboard-write"></iframe>
<script>
  /* 系統的正式網址：之後如果重新建立部署而換了網址，只要改這一行 */
  var APP = 'https://script.google.com/macros/s/AKfycbxxAsRfBmOXJWfV-J1q83dqs1U-S0RQ9L4aos3s_B1uuaF9T3Ng0apq7zXHJN5BAnV4/exec';
  document.getElementById('app').src = APP;
  document.getElementById('direct').href = APP;
</script>
</body>
</html>
